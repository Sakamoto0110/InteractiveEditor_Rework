# Builds PixieInspector on every push to main and on pull requests, on Linux and on Windows, with
# warnings as errors, runs the two versioned checks (the TuxHost and TerminalHost --dump, see the
# development guide), and packs the five packages. publish.yml runs it before publishing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  dotnet:
    name: C# (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build PixieInspector.slnx -c Release -p:EnableWindowsTargeting=true -warnaserror

      - name: TuxHost
        run: dotnet run --project hosts/TuxHost/TuxHost.csproj -c Release --no-build

      - name: TerminalHost --dump
        run: dotnet run --project hosts/TerminalHost/TerminalHost.csproj -c Release --no-build -- --dump

      - name: Pack
        run: dotnet pack PixieInspector.slnx -c Release --no-build -p:EnableWindowsTargeting=true -o artifacts
